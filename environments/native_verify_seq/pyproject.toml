[project]
name = "native-verify-seq"
description = "Execution-as-verification sequence tasks: the model submits a Lean definition, native_decide gates the reward against env-held train and holdout cases"
tags = ["single-turn", "math", "lean", "verifiable-rewards", "procedural", "train", "eval"]
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.8",
    "native-verify @ git+https://github.com/stanleyngugi/native-verify.git",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = ["native_verify_seq.py", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 20
rollouts_per_example = 4
